name: Release assets

# Attach the verified install assets to a published release: the app archive (zip for Windows,
# tar.gz for macOS/Linux), installers stamped with the tag and the archive SHA-256, and SHA256SUMS.
# install.ps1 / install.sh refuse a release without them. Run manually to attach assets to an
# existing release tag.
on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing release tag"
        required: true

permissions:
  contents: write

jobs:
  assets:
    runs-on: ubuntu-latest
    env:
      TAG: ${{ github.event.release.tag_name || inputs.tag }}
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
          ref: ${{ github.event.release.tag_name || inputs.tag }}
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Build archive, stamped installers and SHA256SUMS
        run: python .github/release/build_assets.py --tag "$TAG" --out "$RUNNER_TEMP/dist"
      - name: Upload to the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "$TAG" "$RUNNER_TEMP"/dist/* --clobber --repo "$GITHUB_REPOSITORY"
