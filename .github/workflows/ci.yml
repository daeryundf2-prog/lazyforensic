name: CI

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  python-tests:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # Windows 에서도 훅/파서의 경로·인코딩 동작을 검증한다. macOS는 센터 보조 OS.
        os: [ubuntu-latest, windows-latest, macos-latest]
        python: ["3.12"]
        include:
          # README가 약속하는 최소 버전
          - os: ubuntu-latest
            python: "3.10"
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python }}
      - name: Install pytest
        run: |
          python -m pip install --upgrade pip
          python -m pip install pytest
      - name: Run tests (pytest — 함수형 테스트까지 수집)
        run: |
          python -m pytest test/ -v
      - name: E2E — README 5-minute Kakao workflow (parse→timeline→audit→verify)
        run: |
          python -m pytest test/test_e2e_kakao_workflow.py -v
      - name: Encoding smoke (PYTHONUTF8=0 — cp949 계열 로케일 재현, Windows만)
        if: matrix.os == 'windows-latest'
        env:
          PYTHONUTF8: "0"
        run: |
          python -m pytest test/test_forensic_tools2.py -q -k "contract or envelope"
      - name: Local-only egress audit (새 UNGATED 외부 송신 경로 차단)
        run: |
          python scripts/local_only_audit.py --json
      - name: Hook guard assertions (env + stdin pipe, Linux/Windows/macOS)
        run: |
          node - <<'EOF'
          const { spawnSync } = require('child_process');
          function run(opts) {
            return spawnSync('node', ['scripts/evidence_guard.mjs', 'pre-tool-use'], opts);
          }
          // env 전달 경로: 증거 .raw 쓰기 차단
          const a = run({ encoding: 'utf8', env: { ...process.env, TOOL_INPUT: '{"tool_input":{"file_path":"evidence/usb.raw"}}' } });
          if (a.status !== 1) { console.error('env path did not block:', a.status); process.exit(1); }
          // stdin 파이프 경로 (fstat.size 버그 회귀 방지): 한글 경로 .dmp 차단
          const b = run({ encoding: 'utf8', input: JSON.stringify({ tool_input: { file_path: 'C:\\사건기록\\덤프.dmp' } }) });
          if (b.status !== 1) { console.error('stdin path did not block:', b.status); process.exit(1); }
          console.log('guards OK');
          EOF
        shell: bash

  # 동료 PC 경로 그대로: 설치 스크립트 → 새 셸에서 `lazyforensic report` (한글·공백 경로)
  install-smoke:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest, ubuntu-latest]
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Install (Windows PowerShell 5.1, "irm | iex" 경로를 Get-Content | iex로 재현)
        if: runner.os == 'Windows'
        shell: powershell
        env:
          LAZYFORENSIC_SOURCE: ${{ github.workspace }}
        run: |
          Get-Content -Raw -Encoding UTF8 .\install.ps1 | Invoke-Expression
      - name: Report smoke (Windows, 새 셸 + cmd 진입점)
        if: runner.os == 'Windows'
        shell: powershell
        # 러너는 이 스크립트를 BOM 없는 UTF-8로 써서 PowerShell 5.1이 ANSI로 읽는다 → 한글 리터럴은 env로 넘긴다.
        env:
          EV_NAME: "증거 폴더"
          MEMO_NAME: "메모.txt"
          OUT_NAME: "결과"
          EXPECTED: "보고서초안.html;보고서초안.md;파일해시목록.csv;무결성검증.json"
        run: |
          $userPath = [Environment]::GetEnvironmentVariable("Path", "User")
          $bin = Join-Path $env:LOCALAPPDATA "LazyForensic\bin"
          if (($userPath -split ";") -notcontains $bin) { throw "user PATH missing $bin" }
          # The installer only warns when Pillow fails; fail here so EXIF checks never silently drop out.
          & (Join-Path $env:USERPROFILE ".lfenv\Scripts\python.exe") -c "import PIL, sys; print('Pillow', PIL.__version__, 'on', sys.version.split()[0])"
          if ($LASTEXITCODE -ne 0) { throw "Pillow missing in .lfenv" }
          $ev = Join-Path $env:RUNNER_TEMP $env:EV_NAME
          New-Item -ItemType Directory -Path $ev | Out-Null
          Copy-Item test\fixtures\ewf\synthetic.E01 $ev
          Set-Content -Path (Join-Path $ev $env:MEMO_NAME) -Value "smoke" -Encoding UTF8
          $out = Join-Path $env:RUNNER_TEMP $env:OUT_NAME
          & (Join-Path $bin "lazyforensic.cmd") report $ev -o $out
          if ($LASTEXITCODE -ne 0) { throw "lazyforensic report exit $LASTEXITCODE" }
          $expected = $env:EXPECTED -split ";"
          foreach ($f in $expected) {
            if (-not (Test-Path -LiteralPath (Join-Path $out $f))) { throw "missing $f" }
          }
          $md = Get-Content -Raw -Encoding UTF8 -LiteralPath (Join-Path $out $expected[1])
          if ($md -notmatch "TEST-2026-001") { throw "E01 header not in report" }
      - name: Install (macOS/Linux, "curl | sh" 경로를 stdin 실행으로 재현)
        if: runner.os != 'Windows'
        env:
          LAZYFORENSIC_SOURCE: ${{ github.workspace }}
        run: |
          sh < install.sh
      - name: Report smoke (macOS/Linux, 새 셸)
        if: runner.os != 'Windows'
        run: |
          "$HOME/.lfenv/bin/python" -c "import PIL, sys; print('Pillow', PIL.__version__, 'on', sys.version.split()[0])"
          ev="$RUNNER_TEMP/증거 폴더"
          mkdir -p "$ev"
          cp test/fixtures/ewf/synthetic.E01 "$ev/"
          echo smoke > "$ev/메모.txt"
          "$HOME/.local/bin/lazyforensic" report "$ev" -o "$RUNNER_TEMP/결과"
          for f in 보고서초안.html 보고서초안.md 파일해시목록.csv 무결성검증.json; do test -f "$RUNNER_TEMP/결과/$f"; done
          grep -q TEST-2026-001 "$RUNNER_TEMP/결과/보고서초안.md"

  # 인쇄본 확인: 보고서 DOCX → LibreOffice PDF → Poppler로 그린 쪽에서 한글 글자 확인.
  # 한글 글꼴이 있을 때는 통과하고, 라틴 글꼴만 보이게 한 변환은 같은 텍스트 층이어도 실패해야 한다.
  print-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Install Poppler, LibreOffice Writer and a Korean font
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends poppler-utils libreoffice-writer fonts-noto-cjk fonts-dejavu-core
      - name: Install pytest and the hash-pinned Pillow
        run: |
          python -m pip install --upgrade pip
          python -m pip install pytest
          python -m pip install --require-hashes --only-binary=:all: -r requirements-install.txt
      - name: D21/D24 report tests with print tools and Pillow (print tools may not skip)
        env:
          LF_REQUIRE_PRINT_TOOLS: "1"
        run: |
          python -m pytest test/test_d21_report.py test/test_d24_report.py -v -rs

  node-syntax:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: actions/setup-node@v5
        with:
          node-version: "24"
      - name: Syntax-check all hook scripts
        run: |
          for f in scripts/*.mjs; do node --check "$f"; done
      - name: Markdown structure guard (레포 문서 스트리핑 검사)
        run: |
          node scripts/markdown_structure_guard.mjs --check skills README.md CHANGELOG.md GEMINI.md docs
      - name: JSON validity (hooks, plugin)
        run: |
          node -e "JSON.parse(require('fs').readFileSync('hooks.json','utf8'))"
          node -e "JSON.parse(require('fs').readFileSync('plugin.json','utf8'))"

  korean-law-mcp:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
          repository: daeryundf2-prog/korean-law-mcp
          ref: 44ff16ec884395a3e7424ca8ff76caa081c9390c  # pin: reproducible supply chain
          path: korean-law-mcp
      - uses: actions/setup-node@v5
        with:
          node-version: "24"
      - name: Install (no lifecycle scripts) and build
        working-directory: korean-law-mcp
        run: |
          npm ci --ignore-scripts
          npm run build
      - name: Unit tests (vitest)
        working-directory: korean-law-mcp
        run: npx vitest run
