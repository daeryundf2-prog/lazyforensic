name: CI

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  python-tests:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        # Windows 에서도 훅/파서의 경로·인코딩 동작을 검증한다
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Install pytest
        run: |
          python -m pip install --upgrade pip
          python -m pip install pytest
      - name: Run tests (pytest — 함수형 테스트까지 수집)
        run: |
          python -m pytest test/ -v
      - name: Encoding smoke (PYTHONUTF8=0 — cp949 계열 로케일 재현, Windows만)
        if: matrix.os == 'windows-latest'
        env:
          PYTHONUTF8: "0"
        run: |
          python contracts/verify_contract.py --drift-check contracts/lazy-evidence-case-v1.json
          python -m pytest test/test_forensic_tools2.py -q -k "contract or envelope"
      - name: Local-only egress audit (새 UNGATED 외부 송신 경로 차단)
        run: |
          python scripts/local_only_audit.py --json
      - name: Hook guard assertions (env + stdin pipe, Linux/Windows)
        run: |
          node - <<'EOF'
          const { spawnSync } = require('child_process');
          function run(opts) {
            return spawnSync('node', ['scripts/evidence_guard.mjs', 'pre-tool-use'], opts);
          }
          // env 전달 경로: 증거 .raw 쓰기 차단
          const a = run({ encoding: 'utf8', env: { ...process.env, TOOL_INPUT: '{"tool_input":{"file_path":"evidence/usb.raw"}}' } });
          if (a.status !== 1) { console.error('env path did not block:', a.status); process.exit(1); }
          // stdin 파이프 경로 (fstat.size 버그 회귀 방지): 한글 경로 .dmp 차단
          const b = run({ encoding: 'utf8', input: JSON.stringify({ tool_input: { file_path: 'C:\\사건기록\\덤프.dmp' } }) });
          if (b.status !== 1) { console.error('stdin path did not block:', b.status); process.exit(1); }
          console.log('guards OK');
          EOF
        shell: bash

  node-syntax:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: actions/setup-node@v5
        with:
          node-version: "24"
      - name: Syntax-check all hook scripts
        run: |
          for f in scripts/*.mjs; do node --check "$f"; done
      - name: Markdown structure guard (레포 문서 스트리핑 검사)
        run: |
          node scripts/markdown_structure_guard.mjs --check skills README.md CHANGELOG.md GEMINI.md docs
      - name: JSON validity (hooks, plugin)
        run: |
          node -e "JSON.parse(require('fs').readFileSync('hooks.json','utf8'))"
          node -e "JSON.parse(require('fs').readFileSync('plugin.json','utf8'))"

  korean-law-mcp:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
          repository: daeryundf2-prog/korean-law-mcp
          ref: 44ff16ec884395a3e7424ca8ff76caa081c9390c  # pin: reproducible supply chain
          path: korean-law-mcp
      - uses: actions/setup-node@v5
        with:
          node-version: "24"
      - name: Install (no lifecycle scripts) and build
        working-directory: korean-law-mcp
        run: |
          npm ci --ignore-scripts
          npm run build
      - name: Unit tests (vitest)
        working-directory: korean-law-mcp
        run: npx vitest run
